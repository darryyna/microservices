server:
  port: 9995

spring:
  application:
    name: recommendation-api
  datasource:
    hikari:
      initializationFailTimeout: 60000
      connectionTimeout: 30000
      validationTimeout: 5000
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/movie-recommendations-api
    username: postgres
    password: in3omnia
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger_ui

logging:
  level:
    org:
      springframework: DEBUG

project:
  title: Recommendation Service API

management:
  endpoints:
    web:
      exposure:
        include: health, info

