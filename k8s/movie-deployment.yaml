apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-api
  template:
    metadata:
      labels:
        app: movie-api
    spec:
      containers:
        - name: movie-api
          image: microservices-movie-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9992
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/movie-recommendations-api
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: in3omnia

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9992
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9992
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5